<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <titleParreca & Amor</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #fdfdfd;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 10px;
    }

    .timer {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 600px;
      width: 100%;
    }

    .gallery img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .footer {
      margin-top: 40px;
      font-style: italic;
      font-size: 1em;
      color: #777;
    }

    @media (min-width: 600px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <h1>Para nunca te esqueceres do nosso dia até ao infinito</h1>
  <div class="timer" id="contador"></div>

  <div class="gallery">
    <img src="foto1.jpg" alt="Nós 1" />
    <img src="foto2.jpg" alt="Nós 2" />
    <img src="foto3.jpg" alt="Nós 3" />
  </div>

  <div class="footer">
    Com amor, tua Parreca
  </div>

  <script>
    const inicio = new Date("2024-08-15T00:03:00");

    function atualizarContador() {
      const agora = new Date();
      const tempo = agora - inicio;

      const dias = Math.floor(tempo / (1000 * 60 * 60 * 24));
      const horas = Math.floor((tempo / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((tempo / (1000 * 60)) % 60);
      const segundos = Math.floor((tempo / 1000) % 60);

      document.getElementById("contador").textContent =
        `Juntos há ${dias} dias, ${horas}h ${minutos}m ${segundos}s`;
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();
  </script>
</body>
</html>
